<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Cache Memory Animation</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1d; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        h1 { margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; text-align: center; max-width: 600px; font-size: 18px; }
        #controls { margin-bottom: 15px; display: flex; gap: 10px;}
        button { 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 18px; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #description {
            font-size: 18px;
            font-weight: bold;
            color: #FFC107;
            height: 30px;
            margin-top: 10px;
        }
        canvas { 
            background-color: #2b2b36; 
            border: 2px solid #555; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>

<h1>How CPU Cache Works</h1>
<p>CPU needs data to work. Larger Cache size means fewer slow trips to RAM!</p>

<div id="controls">
    <button id="req1">Request Data (A)</button>
    <button id="req2">Request Data (B)</button>
    <button id="resetBtn">↻ Reset</button>
</div>

<canvas id="cacheCanvas" width="800" height="400"></canvas>

<div id="description">Click a button to start requesting data.</div>

<script>
    const canvas = document.getElementById('cacheCanvas');
    const ctx = canvas.getContext('2d');
    const description = document.getElementById('description');

    const btnA = document.getElementById('req1');
    const btnB = document.getElementById('req2');
    const btnReset = document.getElementById('resetBtn');

    let cache = []; 
    let isAnimating = false;

    // --- UPDATED POSITIONS AND WIDTHS ---
    const positions = {
        cpu: { x: 80, y: 200, r: 60 },
        cache: { x: 290, y: 200, w: 160, h: 160 },
        ram: { x: 520, y: 200, w: 260, h: 250 }
    };

    function setButtons(disabled) {
        btnA.disabled = disabled;
        btnB.disabled = disabled;
        btnReset.disabled = disabled;
    }

    function drawDataBlock(label, x, y, color = '#2196F3') {
        const size = 30;
        ctx.fillStyle = color;
        ctx.fillRect(x - size/2, y - size/2, size, size);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(x - size/2, y - size/2, size, size);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x, y);
    }

    function drawStatic() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Labels
        ctx.fillStyle = '#aaa';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText("CPU (Very Fast)", positions.cpu.x, positions.cpu.y - positions.cpu.r - 10);
        ctx.fillText("CACHE (Fast, Small)", positions.cache.x + positions.cache.w/2, positions.cache.y - positions.cache.h/2 - 10);
        ctx.fillText("RAM (Slow, Large)", positions.ram.x + positions.ram.w/2, positions.ram.y - positions.ram.h/2 - 10);

        // CPU
        ctx.beginPath();
        ctx.arc(positions.cpu.x, positions.cpu.y, positions.cpu.r, 0, Math.PI * 2);
        ctx.fillStyle = '#424242';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.fillText("CPU", positions.cpu.x, positions.cpu.y);

        // Cache
        ctx.fillStyle = '#333';
        ctx.fillRect(positions.cache.x, positions.cache.y - positions.cache.h/2, positions.cache.w, positions.cache.h);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeRect(positions.cache.x, positions.cache.y - positions.cache.h/2, positions.cache.w, positions.cache.h);
        
        ctx.font = 'bold 18px Arial'; // Slightly smaller font to fit nicely
        ctx.fillStyle = '#fff';
        ctx.fillText("Cache Memory", positions.cache.x + positions.cache.w/2, positions.cache.y - 50);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        // Adjusted slot positions for the wider box
        ctx.strokeRect(positions.cache.x + 40, positions.cache.y - 30, 80, 40); 
        ctx.strokeRect(positions.cache.x + 40, positions.cache.y + 20, 80, 40); 

        if (cache[0]) drawDataBlock(cache[0], positions.cache.x + 80, positions.cache.y - 10);
        if (cache[1]) drawDataBlock(cache[1], positions.cache.x + 80, positions.cache.y + 40);

        // RAM
        ctx.fillStyle = '#212121';
        ctx.fillRect(positions.ram.x, positions.ram.y - positions.ram.h/2, positions.ram.w, positions.ram.h);
        ctx.strokeStyle = '#9e9e9e';
        ctx.lineWidth = 3;
        ctx.strokeRect(positions.ram.x, positions.ram.y - positions.ram.h/2, positions.ram.w, positions.ram.h);
        ctx.fillStyle = '#9e9e9e';
        ctx.font = 'bold 18px Arial';
        ctx.fillText("Random Access Memory", positions.ram.x + positions.ram.w/2, positions.ram.y - positions.ram.h/2 + 30);
        
        drawDataBlock('A', positions.ram.x + positions.ram.w/2, positions.ram.y - 20);
        drawDataBlock('B', positions.ram.x + positions.ram.w/2, positions.ram.y + 40);
    }

    function animatePacket(fromX, toX, y, label, color) {
        return new Promise(resolve => {
            let progress = 0;
            const speed = 0.02; 

            function step() {
                drawStatic(); 
                const currentX = fromX + (toX - fromX) * progress;
                drawDataBlock(label, currentX, y, color);

                progress += speed;
                if (progress <= 1) {
                    requestAnimationFrame(step);
                } else {
                    drawStatic();
                    resolve();
                }
            }
            step();
        });
    }

    function drawHitMiss(isHit) {
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        if (isHit) {
            ctx.fillStyle = '#4CAF50';
            ctx.fillText("CACHE HIT!", canvas.width / 2, 70);
        } else {
            ctx.fillStyle = '#F44336';
            ctx.fillText("CACHE MISS!", canvas.width / 2, 70);
        }
    }

    async function handleRequest(dataLabel) {
        if (isAnimating) return;
        isAnimating = true;
        setButtons(true);
        description.innerText = `CPU requesting Data ${dataLabel}...`;
        drawStatic();

        const cpuX = positions.cpu.x + positions.cpu.r;
        const cacheCenterX = positions.cache.x + positions.cache.w / 2;
        const ramCenterX = positions.ram.x + positions.ram.w / 2;
        const centerY = positions.cpu.y;

        // 1. Request to Cache
        await animatePacket(cpuX, cacheCenterX, centerY, '?', '#9e9e9e');
        
        const isInCache = cache.includes(dataLabel);
        drawStatic();
        drawHitMiss(isInCache);
        
        // Brief pause to read "Hit" or "Miss"
        await new Promise(r => setTimeout(r, 1200)); 

        if (isInCache) {
            description.innerText = `CACHE HIT! Data ${dataLabel} found in Cache Memory. Delivery is instant.`;
            await animatePacket(cacheCenterX, cpuX, centerY, dataLabel, '#4CAF50');
            description.innerText = `Data ${dataLabel} delivered from Cache. Very fast!`;
        } else {
            description.innerText = `CACHE MISS! Not in Cache Memory. Must go to RAM...`;
            drawStatic();
            drawHitMiss(false);
            
            await animatePacket(cacheCenterX, ramCenterX, centerY, '?', '#9e9e9e');
            
            description.innerText = `Retrieving Data ${dataLabel} from RAM (slow)...`;
            await animatePacket(ramCenterX, cacheCenterX, centerY, dataLabel, '#F44336');

            description.innerText = `Copying Data ${dataLabel} into Cache for next time.`;
            if (cache.length >= 2) cache.shift(); 
            cache.push(dataLabel);
            drawStatic();
            await new Promise(r => setTimeout(r, 800));

            await animatePacket(cacheCenterX, cpuX, centerY, dataLabel, '#4CAF50');
            description.innerText = `Data ${dataLabel} delivered from RAM and stored in Cache.`;
        }

        isAnimating = false;
        setButtons(false);
    }

    btnA.addEventListener('click', () => handleRequest('A'));
    btnB.addEventListener('click', () => handleRequest('B'));
    btnReset.addEventListener('click', () => {
        cache = [];
        description.innerText = "Simulation reset. Click a button to request data.";
        drawStatic();
    });

    // Start
    drawStatic();
</script>
</body>
</html>
