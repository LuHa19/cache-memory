<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Cache Memory Animation</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1d; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        h1 { margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; text-align: center; max-width: 600px; font-size: 18px; }
        #controls { margin-bottom: 15px; display: flex; gap: 10px;}
        button { 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 18px; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #description {
            font-size: 18px;
            font-weight: bold;
            color: #FFC107;
            height: 30px;
            margin-top: 10px;
        }
        #canvasContainer {
            position: relative;
        }
        canvas { 
            background-color: #2b2b36; 
            border: 2px solid #555; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>

<h1>How CPU Cache Works</h1>
<p>CPU needs data to work. Larger Cache size means fewer slow trips to RAM!</p>

<div id="controls">
    <button id="req1">Request Data (A)</button>
    <button id="req2">Request Data (B)</button>
    <button id="resetBtn">Reset</button>
</div>

<div id="canvasContainer">
    <canvas id="cacheCanvas" width="800" height="400"></canvas>
</div>

<div id="description">Click a button to start requesting data.</div>

<script>
    const canvas = document.getElementById('cacheCanvas');
    const ctx = canvas.getContext('2d');
    const description = document.getElementById('description');

    const buttons = {
        req1: document.getElementById('req1'),
        req2: document.getElementById('req2'),
        reset: document.getElementById('resetBtn')
    };

    let cache = []; // Stores strings 'A' or 'B'
    let currentAnimation = null;

    // Component Positions
    const positions = {
        cpu: { x: 100, y: 200, r: 60 },
        cache: { x: 350, y: 200, w: 120, h: 160 },
        ram: { x: 650, y: 200, w: 150, h: 250 }
    };

    function disableButtons(disabled) {
        buttons.req1.disabled = disabled;
        buttons.req2.disabled = disabled;
    }

    function drawStatic() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw labels
        ctx.fillStyle = '#aaa';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText("CPU (Very Fast)", positions.cpu.x, positions.cpu.y - positions.cpu.r - 10);
        ctx.fillText("CACHE (Fast, Small)", positions.cache.x + positions.cache.w/2, positions.cache.y - positions.cache.h/2 - 10);
        ctx.fillText("RAM (Slow, Large)", positions.ram.x + positions.ram.w/2, positions.ram.y - positions.ram.h/2 - 10);

        // Draw CPU
        ctx.beginPath();
        ctx.arc(positions.cpu.x, positions.cpu.y, positions.cpu.r, 0, Math.PI * 2);
        ctx.fillStyle = '#424242';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.fillText("CPU", positions.cpu.x, positions.cpu.y);

        // Draw Cache
        ctx.fillStyle = '#333';
        ctx.fillRect(positions.cache.x, positions.cache.y - positions.cache.h/2, positions.cache.w, positions.cache.h);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeRect(positions.cache.x, positions.cache.y - positions.cache.h/2, positions.cache.w, positions.cache.h);
        
        // Draw Cache Contents (Backpack blocks)
        ctx.font = 'bold 20px Arial';
        ctx.fillStyle = '#fff';
        ctx.fillText("Backpack", positions.cache.x + positions.cache.w/2, positions.cache.y - 50);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(positions.cache.x + 20, positions.cache.y - 30, 80, 40); // Slot 1
        ctx.strokeRect(positions.cache.x + 20, positions.cache.y + 20, 80, 40); // Slot 2

        if (cache[0]) drawDataBlock(cache[0], positions.cache.x + 60, positions.cache.y - 10);
        if (cache[1]) drawDataBlock(cache[1], positions.cache.x + 60, positions.cache.y + 40);

        // Draw RAM
        ctx.fillStyle = '#212121';
        ctx.fillRect(positions.ram.x, positions.ram.y - positions.ram.h/2, positions.ram.w, positions.ram.h);
        ctx.strokeStyle = '#9e9e9e';
        ctx.lineWidth = 3;
        ctx.strokeRect(positions.ram.x, positions.ram.y - positions.ram.h/2, positions.ram.w, positions.ram.h);
        ctx.fillStyle = '#9e9e9e';
        ctx.font = 'bold 20px Arial';
        ctx.fillText("Locker", positions.ram.x + positions.ram.w/2, positions.ram.y - positions.ram.h/2 + 30);
        
        // Static RAM contents
        drawDataBlock('A', positions.ram.x + positions.ram.w/2, positions.ram.y - 20);
        drawDataBlock('B', positions.ram.x + positions.ram.w/2, positions.ram.y + 40);
    }

    function drawDataBlock(label, x, y, color = '#2196F3') {
        const size = 30;
        ctx.fillStyle = color;
        ctx.fillRect(x - size/2, y - size/2, size, size);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(x - size/2, y - size/2, size, size);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x, y);
    }

    async function animatePacket(fromX, toX, y, label, color = '#FFC107') {
        return new Promise(resolve => {
            let progress = 0;
            const speed = 0.02; // Slower for observation

            function step() {
                drawStatic(); // Redraw background components
                
                const currentX = fromX + (toX - fromX) * progress;
                
                // Draw packet (data block)
                drawDataBlock(label, currentX, y, color);

                progress += speed;
                if (progress <= 1) {
                    requestAnimationFrame(step);
                } else {
                    resolve();
                }
            }
            step();
        });
    }

    function drawHitMiss(isHit) {
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        if (isHit) {
            ctx.fillStyle = '#4CAF50';
            ctx.fillText("CACHE HIT!", canvas.width / 2, 70);
            ctx.fillStyle = 'rgba(76, 175, 80, 0.1)';
        } else {
            ctx.fillStyle = '#F44336';
            ctx.fillText("CACHE MISS!", canvas.width / 2, 70);
            ctx.fillStyle = 'rgba(244, 67, 54, 0.1)';
        }
        ctx.fillRect(positions.cache.x - 10, positions.cache.y - positions.cache.h/2 - 10, positions.cache.w + 20, positions.cache.h + 20);
    }

    async function handleRequest(dataLabel) {
        if (currentAnimation) return;
        currentAnimation = true;
        disableButtons(true);
        description.innerText = `CPU requesting Data ${dataLabel}...`;
        drawStatic();

        const cpuX = positions.cpu.x + positions.cpu.r;
        const cacheCenterX = positions.cache.x + positions.cache.w / 2;
        const ramCenterX = positions.ram.x + positions.ram.w / 2;
        const centerY = positions.cpu.y;

        // 1. Send Request to Cache
        await animatePacket(cpuX, cacheCenterX, centerY, '?', '#9e9e9e');
        
        // 2. Check Cache
        const isInCache = cache.includes(dataLabel);
        drawStatic();
        drawHitMiss(isInCache);
        await new Promise(r => setTimeout(r, 1000)); // Pause to show HIT/MISS

        if (isInCache) {
            // CACHE HIT PATH
            description.innerText = `CACHE HIT! Data ${dataLabel} found in backpack. Delivery is instant.`;
            await animatePacket(cacheCenterX, cpuX, centerY, dataLabel, '#4CAF50');
            description.innerText = `Data ${dataLabel} delivered from Cache. Very fast!`;
        } else {
            // CACHE MISS PATH
            description.innerText = `CACHE MISS! Not in backpack. Must walk to Locker (RAM)...`;
            drawStatic();
            drawHitMiss(false);
            
            // 3. Send Request to RAM
            await animatePacket(cacheCenterX, ramCenterX, centerY, '?', '#9e9e9e');
            
            // 4. Retrieve from RAM
            description.innerText = `Retrieving Data ${dataLabel} from RAM (slow)...`;
            await animatePacket(ramCenterX, cacheCenterX, centerY, dataLabel, '#F44336');

            // 5. Update Cache (Copy data into backpack)
            description.innerText = `Copying Data ${dataLabel} into Cache for next time.`;
            if (cache.length >= 2) cache.shift(); // Simple replacement policy: remove oldest
            cache.push(dataLabel);
            drawStatic();
            await new Promise(r => setTimeout(r, 800));

            // 6. Deliver to CPU
            await animatePacket(cacheCenterX, cpuX, centerY, dataLabel, '#4CAF50');
            description.innerText = `Data ${dataLabel} delivered from RAM and stored in Cache.`;
        }

        drawStatic();
        currentAnimation = null;
        disableButtons(false);
    }

    buttons.req1.addEventListener('click', () => handleRequest('A'));
    buttons.req2.addEventListener('click', () => handleRequest('B'));
    buttons.reset.addEventListener('click', () => {
        cache = [];
        description.innerText = "Simulation reset. Click a button to request data.";
        drawStatic();
    });

    // Initial setup
    drawStatic();
</script>
</body>
</html>
